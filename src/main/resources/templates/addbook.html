<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Bookstore - Add / Edit Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <div class="container">
        <h1>Add / Edit Book</h1>

        <form th:object="${book}" th:action="@{/save}" action="#" method="post">

            <!-- kept empty for new books, filled in for edited books -->
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" />
            </div>

            <div>
                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}" class="form-control" />
            </div>

            <div>
                <label for="publicationYear">Year</label>
                <input type="text" id="publicationYear" th:field="*{publicationYear}" class="form-control" />
            </div>

            <div>
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" class="form-control" />
            </div>

            <div>
                <label for="price">Price</label>
                <input type="text" id="price" th:field="*{price}" class="form-control" />
            </div>

            <br />
            <input type="submit" value="Save" class="btn btn-success" />
        </form>
    </div>
</body>

</html>
